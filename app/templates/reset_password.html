{% extends "base.html" %}
{% block title %}Choose a new password · {{ app_name }}{% endblock %}
{% block page %}reset{% endblock %}
{% block content %}
<h1>Choose a new password</h1>
<form id="reset-form" class="stack">
  <label for="new-password">New password</label>
  <input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="8" required>
  <button type="submit">Save password</button>
</form>
{% endblock %}
